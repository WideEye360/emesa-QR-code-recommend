<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ресторант</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background-image:
    linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
    url("https://lh3.googleusercontent.com/sitesv/AG8ngQVnZUsxONfWCeNxRWZEwg0Ws9NA-7cBdVjXNL34cflp8H3idDiVY3j7wKcGtqGvYu6XappuP-XUnm6OFHt2-U1yyr-uu5QKT4ZpWXVI8wv2FvbQ2oiW667YymaJHstAx4QF5UEgEQJuL5oEiDf-OylPYcbZfwjgSYXm9bz4ANL8PaWwbs2yt08ybed8oL0CpGBYEC4nfOFkNMXputYY_MIGJxYofK5S8hIUAJUl=w1280");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}


    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .view-button {
      color: white;
      background: #111827;
    }

    .share-button {
      color: #111827;
      background: white;
      border: 1px solid #d1d5db;
    }
.google-button {
  color: white;
  background: #4285F4;
}

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="buttons">

      <button class="view-button" onclick="viewRestaurant()">
        Виж ресторанта
      </button>

      <button class="share-button" onclick="shareRestaurant()">
        Препоръчай на приятел
      </button>
<button class="google-button" onclick="rateUs()">
  ⭐ Остави оценка в Google
</button>

    </div>
  </div>

  <script>
    function viewRestaurant() {
      // Replace this with your restaurant URL
      window.open("https://maps.app.goo.gl/B3fL4zZrSiUKcPQG9");
    }
const restaurantUrl = "https://maps.app.goo.gl/B3fL4zZrSiUKcPQG9";

   async function shareRestaurant() {
  const shareData = {
    title: "Виж този ресторант!",
    text: "Мисля си, че може да ти хареса.",
    url: restaurantUrl
  };

  // Mobile/tablet: use native sharing
  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (error) {
      // User cancelled sharing — do nothing.
      console.log("Sharing cancelled");
    }
  } 
  
  // Desktop: copy link to clipboard
  else {
    try {
      await navigator.clipboard.writeText(restaurantUrl);
      alert("Линкът е копиран!");
    } catch (error) {
      alert("Copy this link to share: " + restaurantUrl);
    }
  }
}
function rateUs() {
  window.open(
    "https://search.google.com/local/writereview?placeid=ChIJ__JRg86FqkARNY3_-i3QHp4",
    "_blank"
  );
}
  </script>

</body>
</html>
