<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Language</title>

  <style>
    * {
      box-sizing: border-box;
    }

  body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  background-image:
    linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
    url("https://lh3.googleusercontent.com/sitesv/AG8ngQVnZUsxONfWCeNxRWZEwg0Ws9NA-7cBdVjXNL34cflp8H3idDiVY3j7wKcGtqGvYu6XappuP-XUnm6OFHt2-U1yyr-uu5QKT4ZpWXVI8wv2FvbQ2oiW667YymaJHstAx4QF5UEgEQJuL5oEiDf-OylPYcbZfwjgSYXm9bz4ANL8PaWwbs2yt08ybed8oL0CpGBYEC4nfOFkNMXputYY_MIGJxYofK5S8hIUAJUl=w1280");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .view-button {
      color: white;
      background: #111827;
    }

    .share-button {
      color: #111827;
      background: white;
      border: 1px solid #d1d5db;
    }

    .google-button {
      color: white;
      background: #4285F4;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Language popup */
    .language-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }

    .language-popup {
      width: 100%;
      max-width: 340px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .language-popup h2 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #111827;
    }

    .language-popup p {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .language-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .language-button {
      background: #111827;
      color: white;
    }

    .language-button.bulgarian {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
  </style>
</head>

<body>

  <!-- Language selection popup -->
  <div class="language-overlay" id="languageOverlay">
    <div class="language-popup">
      <h2>Choose Language</h2>
      <p>Изберете език</p>

      <div class="language-buttons">
        <button
          class="language-button"
          onclick="selectLanguage('en')">
          🇬🇧 English
        </button>

        <button
          class="language-button bulgarian"
          onclick="selectLanguage('bg')">
          🇧🇬 Български
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="buttons">

      <button class="view-button" onclick="viewRestaurant()">
        View Restaurant
      </button>

      <button class="share-button" onclick="shareRestaurant()">
        Share with a friend
      </button>

      <button class="google-button" onclick="rateUs()">
        ⭐ Rate us on Google
      </button>

    </div>
  </div>

  <script>
    function selectLanguage(language) {
      if (language === "en") {
        window.location.href = "index-en.html";
      }

      if (language === "bg") {
        window.location.href = "index-bg.html";
      }
    }

    const restaurantUrl =
      "https://maps.app.goo.gl/B3fL4zZrSiUKcPQG9";

    function viewRestaurant() {
      window.open(restaurantUrl, "_blank");
    }

    async function shareRestaurant() {
      const shareData = {
        title: "Check out this restaurant!",
        text: "I found this restaurant and thought you might like it.",
        url: restaurantUrl
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          console.log("Sharing cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(restaurantUrl);
          alert("Restaurant link copied to clipboard!");
        } catch (error) {
          alert("Copy this link to share: " + restaurantUrl);
        }
      }
    }

    function rateUs() {
      window.open(
        "https://search.google.com/local/writereview?placeid=ChIJ__JRg86FqkARNY3_-i3QHp4",
        "_blank"
      );
    }
  </script>

</body>
</html>
